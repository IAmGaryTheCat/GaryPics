name: Auto Pull

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - host: ${{ secrets.SERVER_IP_1 }}
            user: twoblade

          - host: ${{ secrets.SERVER_IP_2 }}
            user: gary

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ matrix.host }}
          username: ${{ matrix.user }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/GaryPics
            git pull
